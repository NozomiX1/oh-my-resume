<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resume Template Mockup</title>
    <link rel="stylesheet" href="../styles/compact-technical.css?v=20260522">
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 980px;
        color: #1f2937;
        background: #e6ebf2;
        font-family: Arial, "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }

      .mockup-toolbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 12px 16px;
        border-bottom: 1px solid #cbd5e1;
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(10px);
      }

      .mockup-toolbar h1 {
        margin: 0;
        color: #111827;
        font-size: 16px;
      }

      .mockup-toolbar span {
        color: #64748b;
        font-size: 12px;
      }

      .mockup-stage {
        display: grid;
        justify-items: center;
        padding: 22px;
      }

      .paper-zoom {
        width: 210mm;
        height: 297mm;
        position: relative;
      }

      .endfield-profile {
        --endfield-section-radius: 1.1mm;
        position: relative;
        isolation: isolate;
        background:
          radial-gradient(rgba(17, 24, 39, 0.14) 0.54pt, transparent 0.72pt) 0 0 / 3mm 3mm,
          rgb(236, 236, 236);
      }

      .endfield-profile .resume-header {
        position: relative;
        z-index: 1;
        grid-template-columns: calc(32mm * var(--fit-scale)) minmax(0, 1fr);
        column-gap: calc(7mm * var(--fit-scale));
        align-items: center;
        min-height: calc(43mm * var(--fit-scale));
        margin-bottom: calc(1mm * var(--fit-scale));
        padding:
          calc(6mm * var(--fit-scale))
          calc(8mm * var(--fit-scale))
          calc(6mm * var(--fit-scale))
          calc(7mm * var(--fit-scale));
        overflow: hidden;
        color: #f8fafc;
        background:
          linear-gradient(rgba(255, 255, 255, 0.56), rgba(255, 255, 255, 0.56)) left 2.3mm top 2.3mm / 8mm 0.55pt no-repeat,
          linear-gradient(rgba(255, 255, 255, 0.56), rgba(255, 255, 255, 0.56)) left 2.3mm top 2.3mm / 0.55pt 8mm no-repeat,
          linear-gradient(rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.24)) right 2.3mm top 2.3mm / 8mm 0.55pt no-repeat,
          linear-gradient(rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.24)) right 2.3mm top 2.3mm / 0.55pt 8mm no-repeat,
          linear-gradient(rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.2)) left 2.3mm bottom 2.3mm / 8mm 0.55pt no-repeat,
          linear-gradient(rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.2)) left 2.3mm bottom 2.3mm / 0.55pt 8mm no-repeat,
          linear-gradient(rgba(255, 215, 0, 0.52), rgba(255, 215, 0, 0.52)) right 2.3mm bottom 2.3mm / 8mm 0.55pt no-repeat,
          linear-gradient(rgba(255, 215, 0, 0.52), rgba(255, 215, 0, 0.52)) right 2.3mm bottom 2.3mm / 0.55pt 8mm no-repeat,
          radial-gradient(rgba(255, 255, 255, 0.075) 0.45px, transparent 0.7px) 0 0 / 4px 4px,
          radial-gradient(rgba(0, 0, 0, 0.22) 0.6px, transparent 0.85px) 2px 2px / 4px 4px,
          repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.018) 0 1px, transparent 1px 4px),
          repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.014) 0 1px, transparent 1px 4px),
          repeating-linear-gradient(135deg, transparent 0 3pt, rgba(255, 255, 255, 0.018) 3pt 3.5pt, transparent 3.5pt 7pt),
          linear-gradient(90deg, rgba(255, 215, 0, 0.12), transparent 18%),
          rgb(36, 36, 36);
        border-radius: 4.2mm;
        box-shadow: 0 2mm 6mm rgba(15, 23, 42, 0.18);
      }

      .endfield-profile .resume-header::before {
        content: "";
        position: absolute;
        top: calc(9mm * var(--fit-scale));
        left: calc(4mm * var(--fit-scale));
        width: calc(2.2mm * var(--fit-scale));
        height: calc(2.2mm * var(--fit-scale));
        background: #ffd700;
      }

      .endfield-profile .resume-header::after {
        content: "///";
        position: absolute;
        top: 4.5mm;
        right: 7mm;
        color: #ff6b00;
        font-size: 11pt;
        font-weight: 900;
        letter-spacing: -1pt;
        transform: skew(-16deg);
      }

      .endfield-profile .resume-profile {
        grid-column: 2;
        grid-row: 1;
        position: relative;
        z-index: 1;
        text-align: left;
      }

      .endfield-profile .resume-profile::before {
        content: "[ RESUME_PROFILE ]";
        display: block;
        margin-bottom: calc(3pt * var(--fit-scale));
        color: rgba(255, 255, 255, 0.36);
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: calc(5.8pt * var(--fit-scale));
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .endfield-profile .resume-header h1 {
        margin-bottom: 2pt;
        color: #ffffff;
        font-size: calc(20pt * var(--fit-scale));
        font-weight: 900;
        letter-spacing: 0;
      }

      .endfield-profile .resume-title {
        margin-bottom: 4pt;
        color: rgba(255, 255, 255, 0.78);
        font-size: calc(9.3pt * var(--fit-scale));
        font-weight: 800;
      }

      .endfield-profile .resume-contacts {
        justify-content: flex-start;
        gap: 1.5pt 11pt;
        color: rgba(255, 255, 255, 0.7);
        font-size: calc(7.7pt * var(--fit-scale));
        line-height: 1.35;
      }

      .endfield-profile .resume-contacts .contact:not(.contact-row-start)::before {
        color: rgba(255, 215, 0, 0.68);
      }

      .endfield-profile .resume-header a {
        color: #ffffff;
      }

      .endfield-profile .resume-header .resume-photo {
        grid-column: 1;
        grid-row: 1;
        justify-self: start;
        position: relative;
        z-index: 1;
        width: calc(28mm * var(--fit-scale));
        height: calc(28mm * var(--fit-scale));
        border: 1.2pt solid rgba(255, 255, 255, 0.9);
        outline: 1pt solid rgba(255, 215, 0, 0.82);
        outline-offset: -2.2mm;
        box-shadow:
          1.8mm -1.8mm 0 -0.7mm #ff6b00,
          0 0 0 0.7pt rgba(255, 255, 255, 0.16);
        clip-path: polygon(0 0, 100% 0, 100% calc(100% - 4mm), calc(100% - 4mm) 100%, 0 100%);
      }

      .endfield-profile main {
        position: relative;
        z-index: 1;
      }

      .endfield-profile .resume-section {
        position: relative;
        z-index: 1;
        margin-bottom: calc(1mm * var(--fit-scale));
      }

      .endfield-profile .resume-section h2 {
        position: relative;
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        align-items: center;
        gap: 4pt;
        min-height: calc(7.6mm * var(--fit-scale));
        margin-bottom: calc(1mm * var(--fit-scale));
        padding:
          calc(1.1mm * var(--fit-scale))
          calc(2.8mm * var(--fit-scale))
          calc(1.1mm * var(--fit-scale))
          calc(4mm * var(--fit-scale));
        overflow: visible;
        color: #f8fafc;
        border: 0;
        border-radius: var(--endfield-section-radius);
        background:
          repeating-linear-gradient(
            135deg,
            transparent 0 1.15px,
            rgba(255, 255, 255, 0.065) 1.15px 1.65px,
            rgba(255, 255, 255, 0.02) 1.65px 2.8px,
            transparent 2.8px 4px
          ),
          linear-gradient(90deg, #262a2e, #1c2025);
        box-shadow:
          0 0 8pt rgba(255, 215, 0, 0.68),
          0 0 15pt rgba(255, 215, 0, 0.24),
          inset 0 0 0 0.7pt rgba(255, 255, 255, 0.08);
        font-size: calc(10.5pt * var(--fit-scale));
        font-weight: 900;
        line-height: 1;
        white-space: nowrap;
      }

      .endfield-profile .resume-section h2 > * {
        position: relative;
        z-index: 1;
      }

      .endfield-profile .resume-section h2::before {
        content: "";
        display: block;
        position: absolute;
        top: calc(1.35mm * var(--fit-scale));
        bottom: calc(1.35mm * var(--fit-scale));
        left: calc(1.7mm * var(--fit-scale));
        width: calc(0.9mm * var(--fit-scale));
        background: #ffea00;
        box-shadow: 0 0 4pt rgba(255, 215, 0, 0.65);
      }

      .endfield-profile .resume-section h2::after {
        content: none;
      }

      .endfield-profile .section-content-card {
        position: relative;
        overflow: hidden;
        padding:
          calc(2mm * var(--fit-scale))
          calc(2.6mm * var(--fit-scale))
          calc(3.2mm * var(--fit-scale));
        color: #111827;
        background: rgb(220, 220, 220);
        border: 0.6pt solid rgba(148, 163, 184, 0.48);
        border-radius: var(--endfield-section-radius);
        box-shadow: 0 1mm 2.6mm rgba(15, 23, 42, 0.1);
      }

      .endfield-profile .section-content-card::before {
        content: "";
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: calc(1.73mm * var(--fit-scale));
        background: linear-gradient(180deg, rgba(220, 220, 220, 0) 0, #fff1c8 42%, #ffbf3d 100%);
      }

      .endfield-profile .section-content-card::after {
        content: "";
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: calc(0.23mm * var(--fit-scale));
        background: #f4a400;
      }

      .endfield-profile .section-content-card > * {
        position: relative;
        z-index: 1;
      }

      .endfield-profile .paper-hud {
        position: absolute;
        inset: 0;
        z-index: 0;
        color: rgba(17, 24, 39, 0.36);
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 4.4pt;
        font-weight: 700;
        letter-spacing: 0.08em;
        line-height: 1.15;
        pointer-events: none;
        text-transform: uppercase;
      }

      .endfield-profile .paper-hud__block {
        position: absolute;
        display: grid;
        gap: 0.8mm;
      }

      .endfield-profile .paper-hud__top-left {
        top: 2.2mm;
        left: 2.8mm;
        width: 45mm;
      }

      .endfield-profile .paper-hud__top-right {
        top: 2.2mm;
        right: 2.8mm;
        width: 58mm;
        justify-items: end;
        text-align: right;
      }

      .endfield-profile .paper-hud__bottom-left {
        bottom: 2.2mm;
        left: 2.8mm;
        width: 52mm;
      }

      .endfield-profile .paper-hud__bottom-right {
        right: 2.8mm;
        bottom: 2.2mm;
        width: 35mm;
        justify-items: end;
        text-align: right;
      }

      .endfield-profile .paper-hud__label {
        color: rgba(17, 24, 39, 0.5);
      }

      .endfield-profile .paper-hud__accent {
        color: rgba(244, 164, 0, 0.86);
      }

      .endfield-profile .paper-hud__barcode {
        width: 34mm;
        height: 2.8mm;
        opacity: 0.68;
        background:
          repeating-linear-gradient(
            90deg,
            rgba(17, 24, 39, 0.42) 0 0.28mm,
            transparent 0.28mm 0.55mm,
            rgba(17, 24, 39, 0.42) 0.55mm 1mm,
            transparent 1mm 1.7mm
          );
      }

      .endfield-profile .paper-hud__status {
        display: inline-flex;
        align-items: end;
        gap: 1.2mm;
      }

      .endfield-profile .paper-hud__signal {
        display: inline-grid;
        grid-auto-flow: column;
        align-items: end;
        gap: 0.35mm;
        height: 2.7mm;
      }

      .endfield-profile .paper-hud__signal i {
        display: block;
        width: 0.65mm;
        background: rgba(244, 164, 0, 0.78);
      }

      .endfield-profile .paper-hud__signal i:nth-child(1) {
        height: 0.9mm;
      }

      .endfield-profile .paper-hud__signal i:nth-child(2) {
        height: 1.5mm;
      }

      .endfield-profile .paper-hud__signal i:nth-child(3) {
        height: 2.2mm;
      }

      .endfield-profile .paper-hud__ruler {
        position: relative;
        width: 48mm;
        height: 7mm;
        border-bottom: 0.55pt solid rgba(17, 24, 39, 0.34);
        background:
          repeating-linear-gradient(90deg, rgba(17, 24, 39, 0.38) 0 0.45pt, transparent 0.45pt 2mm);
      }

      .endfield-profile .paper-hud__ruler::before,
      .endfield-profile .paper-hud__ruler::after {
        position: absolute;
        bottom: 1.7mm;
        color: rgba(17, 24, 39, 0.4);
      }

      .endfield-profile .paper-hud__ruler::before {
        content: "0";
        left: 0;
      }

      .endfield-profile .paper-hud__ruler::after {
        content: "50";
        right: 0;
      }

      .endfield-profile .paper-hud__matrix {
        display: grid;
        grid-template-columns: repeat(8, 1.35mm);
        gap: 0.35mm;
        padding: 0.75mm;
        border: 0.55pt solid rgba(17, 24, 39, 0.3);
        background: rgba(255, 255, 255, 0.22);
      }

      .endfield-profile .paper-hud__matrix span {
        width: 1.35mm;
        height: 1.35mm;
        background: rgba(17, 24, 39, 0.1);
      }

      .endfield-profile .paper-hud__matrix span[data-on="1"] {
        background: rgba(17, 24, 39, 0.42);
      }
    </style>
  </head>
  <body>
    <nav class="mockup-toolbar" aria-label="Mockup status">
      <h1>Current Base Template</h1>
      <span>真实 HTML/CSS，复用当前 parser/render 输出</span>
    </nav>

    <main class="mockup-stage">
      <div class="paper-zoom">
        <article class="resume-page density-normal endfield-profile" data-resume></article>
      </div>
    </main>

    <script type="module">
      import { exampleMarkdown } from "../src/example.js?v=20260522";
      import { parseResumeMarkdown } from "../src/parser.js?v=20260522";
      import { renderResumeHtml } from "../src/render.js?v=20260522";
      import { markContactRowStarts } from "../src/contactRows.js?v=20260522";
      import { applyDensityClass, getOverflowRatio } from "../src/fit.js?v=20260522";

      const doc = parseResumeMarkdown(exampleMarkdown);
      doc.uploadedPhoto = "../frontend/public/avatar-placeholder.png";

      for (const page of document.querySelectorAll("[data-resume]")) {
        page.innerHTML = renderResumeHtml(doc);
        wrapSectionContent(page);
        markContactRowStarts(page);
        addPaperHud(page);
        void fitMockupToPage(page);
      }

      function wrapSectionContent(page) {
        for (const section of page.querySelectorAll(".resume-section")) {
          const heading = section.querySelector("h2");

          if (!heading || heading.nextElementSibling?.classList.contains("section-content-card")) {
            continue;
          }

          const card = document.createElement("div");
          card.className = "section-content-card";

          while (heading.nextSibling) {
            card.append(heading.nextSibling);
          }

          section.append(card);
        }
      }

      function addPaperHud(page) {
        const hud = document.createElement("div");
        hud.className = "paper-hud";
        hud.setAttribute("aria-hidden", "true");
        hud.innerHTML = `
          <div class="paper-hud__block paper-hud__top-left">
            <div class="paper-hud__label">FILE OHMR-SAKIKO-02</div>
            <div>CLASS <span class="paper-hud__accent">B-1</span> / REC 0214</div>
            <div class="paper-hud__barcode"></div>
          </div>
          <div class="paper-hud__block paper-hud__top-right">
            <div class="paper-hud__status">
              <span>STATUS ACTIVE</span>
              <span class="paper-hud__signal"><i></i><i></i><i></i></span>
            </div>
            <div>LOC 35.6812N / 139.7671E</div>
            <div>SYNC 2026.05.21</div>
          </div>
          <div class="paper-hud__block paper-hud__bottom-left">
            <div>X-AXIS / MILLIMETER GRID</div>
            <div class="paper-hud__ruler"></div>
          </div>
          <div class="paper-hud__block paper-hud__bottom-right">
            <div class="paper-hud__matrix">
              ${"1110010110011010011011010110001111100101100101100110110010110111"
                .split("")
                .map((bit) => `<span data-on="${bit}"></span>`)
                .join("")}
            </div>
            <div>ID HASH <span class="paper-hud__accent">7F-21-A9</span></div>
          </div>
        `;
        page.append(hud);
      }

      async function fitMockupToPage(page) {
        for (let level = 0; level <= 2; level += 1) {
          const scale = await findLargestFittingScale(page, level);

          if (scale !== null) {
            applyDensityClass(page, level);
            applyMockupFitScale(page, scale);
            markContactRowStarts(page);
            return;
          }
        }

        applyDensityClass(page, 2);
        applyMockupFitScale(page, 0.78);
        markContactRowStarts(page);
      }

      async function findLargestFittingScale(page, level) {
        applyDensityClass(page, level);
        applyMockupFitScale(page, 1);
        markContactRowStarts(page);
        await nextFrame();

        if (getCurrentOverflowRatio(page) === 0) {
          return 1;
        }

        let low = 0.78;
        let high = 1;

        applyMockupFitScale(page, low);
        markContactRowStarts(page);
        await nextFrame();

        if (getCurrentOverflowRatio(page) > 0) {
          return null;
        }

        for (let index = 0; index < 8; index += 1) {
          const mid = (low + high) / 2;
          applyMockupFitScale(page, mid);
          markContactRowStarts(page);
          await nextFrame();

          if (getCurrentOverflowRatio(page) === 0) {
            low = mid;
          } else {
            high = mid;
          }
        }

        return low;
      }

      function applyMockupFitScale(page, scale) {
        const numericScale = Number(scale);
        const normalizedScale = Number.isFinite(numericScale)
          ? Math.min(Math.max(numericScale, 0.78), 1)
          : 1;
        page.style.setProperty("--fit-scale", normalizedScale.toFixed(3));
      }

      function getCurrentOverflowRatio(page) {
        return getOverflowRatio(page.scrollHeight, page.clientHeight);
      }

      function nextFrame() {
        return new Promise((resolve) => {
          requestAnimationFrame(resolve);
        });
      }
    </script>
  </body>
</html>
