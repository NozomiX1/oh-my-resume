<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Endfield Resume Template V3 Blank</title>
    <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-width: 980px;
        background: #e6ebf2;
        font-family: Arial, "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }

    .mockup-toolbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 12px 16px;
        border-bottom: 1px solid #cbd5e1;
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(10px);
    }

    .mockup-toolbar h1 {
        margin: 0;
        color: #111827;
        font-size: 16px;
    }

    .mockup-toolbar span {
        color: #64748b;
        font-size: 12px;
    }

    .mockup-stage {
        display: grid;
        justify-items: center;
        padding: 22px;
    }

    .blank-page {
        position: relative;
        width: 210mm;
        height: 297mm;
        overflow: hidden;
        background: #ffffff;
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.18);
    }

    .endfield-sidebar {
        --sidebar-width: 13mm;
        position: absolute;
        inset: 0 auto 0 0;
        z-index: 2;
        display: flex;
        width: var(--sidebar-width);
        flex-direction: column;
        align-items: center;
        background: #ffffff;
        box-shadow: 4mm 0 12mm rgba(15, 23, 42, 0.08);
    }

    .endfield-sidebar::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 0.65mm;
        height: 1.6mm;
        background: #0c8f78;
    }

    .endfield-sidebar-logo {
        display: grid;
        width: 8.9mm;
        margin-top: 5.4mm;
        margin-bottom: 14mm;
        place-items: center;
        color: #171a1c;
    }

    .endfield-sidebar-logo svg {
        display: block;
        width: 100%;
        height: auto;
    }

    .endfield-sidebar-nav {
        display: grid;
        width: 100%;
        gap: 3.7mm;
        justify-items: center;
    }

    .endfield-sidebar-item {
        position: relative;
        display: grid;
        width: 100%;
        height: 10.8mm;
        place-items: center;
        color: #d7d9db;
    }

    .endfield-sidebar-item.is-active {
        color: #171a1c;
        background: #e7e7e7;
    }

    .endfield-sidebar-item.is-active::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0.95mm;
        background: #171a1c;
    }

    .endfield-sidebar-item svg {
        display: block;
        width: 5.7mm;
        height: auto;
        max-height: 6.2mm;
    }

    .endfield-sidebar-item[data-key="aicGameplay"] svg, .endfield-sidebar-item[data-key="notice"] svg {
        width: 5.2mm;
        max-height: 5.8mm;
    }

    .endfield-sidebar-fallback {
        font-family: Arial, "Noto Sans SC", "Microsoft YaHei", sans-serif;
        font-size: 5pt;
        font-weight: 900;
        line-height: 1;
    }

    @media print {
        body {
            background: #ffffff;
        }

        .mockup-toolbar {
            display: none;
        }

        .mockup-stage {
            padding: 0;
        }

        .blank-page {
            box-shadow: none;
        }
    }
    </style>
</head>

    <script type="module">
    const NAV_KEYS = ["home", "operator", "lore", "information", "calendar", "aicGameplay", "notice"];
    const ACTIVE_KEY = "operator";

    function cleanupSvg(svg) {
        const clone = svg.cloneNode(true);
        clone.removeAttribute("class");
        clone.removeAttribute("style");
        clone.setAttribute("aria-hidden", "true");
        clone.setAttribute("focusable", "false");
        return clone;
    }

    function fallbackIcon(key) {
        const span = document.createElement("span");
        span.className = "endfield-sidebar-fallback";
        span.textContent = key.slice(0, 2).toUpperCase();
        return span;
    }

    async function loadSidebarAssets() {
        const response = await fetch("./endfield-web.html");
        const html = await response.text();
        const reference = new DOMParser().parseFromString(html, "text/html");
        const pcHeader = reference.querySelector(".Header_pcHeaderContainer__Sy_8l");
        const logo = pcHeader?.querySelector(".Header_logo__s3lE_");
        const icons = new Map();

        for (const navItem of pcHeader?.querySelectorAll(".Header_navItem__c_fLB") ?? []) {
            const svg = navItem.querySelector("svg[data-key]");
            const label = navItem.querySelector(".Header_textWrapper__o9aHt")?.textContent.trim() ?? "";

            if (svg) {
                icons.set(svg.dataset.key, {
                    icon: cleanupSvg(svg),
                    label,
                });
            }
        }

        return {
            logo: logo ? cleanupSvg(logo) : null,
            icons,
        };
    }

    function renderSidebar(page, assets) {
        const sidebar = document.createElement("aside");
        sidebar.className = "endfield-sidebar";
        sidebar.setAttribute("aria-label", "Endfield collapsed navigation");

        const logoBox = document.createElement("div");
        logoBox.className = "endfield-sidebar-logo";

        if (assets.logo) {
            logoBox.append(assets.logo);
        } else {
            logoBox.append(fallbackIcon("endfield"));
        }

        const nav = document.createElement("nav");
        nav.className = "endfield-sidebar-nav";
        nav.setAttribute("aria-label", "Endfield top navigation");

        for (const key of NAV_KEYS) {
            const item = document.createElement("div");
            item.className = `endfield-sidebar-item${key === ACTIVE_KEY ? " is-active" : ""}`;
            item.dataset.key = key;

            const asset = assets.icons.get(key);
            const label = asset?.label || key;

            item.setAttribute("aria-label", label);
            item.title = label;
            item.append(asset ? asset.icon.cloneNode(true) : fallbackIcon(key));
            nav.append(item);
        }

        sidebar.append(logoBox, nav);
        page.append(sidebar);
    }

    async function init() {
        const assets = await loadSidebarAssets();

        for (const page of document.querySelectorAll("[data-page]")) {
            renderSidebar(page, assets);
        }
    }

    init();
    </script>
