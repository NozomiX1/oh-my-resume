        color: var(--endfield-muted);
        font-size: calc(var(--endfield-header-deco-unit) * 1.375);

      }

      .resume-page.with-endfield-tab .endfield-header-deco-slot .__02-Operator_title__Qc2kT {
        color: var(--endfield-text);
      }

      .resume-page.with-endfield-tab .endfield-header-deco-slot .__02-Operator_decoTextIcon__KoX_N {
        position: absolute;
        top: calc(var(--endfield-header-deco-unit) * 0.3125);
        left: calc(var(--endfield-header-deco-unit) * 9.6875);
        width: calc(var(--endfield-header-deco-unit) * 10);
        height: auto;
        color: var(--endfield-muted);

      .resume-page.with-endfield-tab .endfield-header-deco-slot .__02-Operator_nameContainer__yjlQE {
        display: flex;
        width: calc(var(--endfield-header-deco-unit) * 19.375);
        height: calc(var(--endfield-header-deco-unit) * 1.25);
        margin-top: calc(var(--endfield-header-deco-unit) * 0.875);
        align-items: center;
        justify-content: space-between;
        padding: calc(var(--endfield-header-deco-unit) * 0.0625) calc(var(--endfield-header-deco-unit) * 0.25);
        color: var(--endfield-text);
        background: var(--endfield-line);
        font-size: calc(var(--endfield-header-deco-unit) * 1);
        font-weight: 700;
        line-height: calc(var(--endfield-header-deco-unit) * 1.25);
      }

      .resume-page.with-endfield-tab .endfield-header-deco-slot .__02-Operator_stars__ebGpw {
        display: none;
      }

      .resume-page.with-endfield-tab .endfield-notice-date {
        --endfield-notice-u: calc(var(--endfield-side-rail-width) / 8.25);

        position: absolute;
        top: 0;
        right: 0;
        z-index: 3;
        width: var(--endfield-side-rail-width);
        height: calc(var(--endfield-notice-u) * 37.375);
        color: var(--endfield-notice-text);
        font-family: Arial, "Noto Sans SC", "Microsoft YaHei", sans-serif;

      }

      .resume-page.with-endfield-tab .endfield-notice-date .__06-Notice_wrapper__g1OkM {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background-color: var(--endfield-yellow);
        background-image: none;

        mix-blend-mode: normal;
        opacity: 1;
      }

      .resume-page.with-endfield-tab .endfield-notice-date .__06-Notice_textWrapper__nvUA3 {
        position: absolute;
        top: calc(var(--endfield-notice-u) * 18.6875);
        left: 0;
        display: flex;
        width: 100%;
        flex-direction: column;
        align-items: center;
      }

      .resume-page.with-endfield-tab .endfield-notice-date .__06-Notice_latest__ySg6h {
        position: relative;
        color: var(--endfield-notice-text);
        font-size: calc(var(--endfield-notice-u) * 2.25);
        font-weight: 800;
        line-height: 1;
      }

      .resume-page.with-endfield-tab .endfield-notice-date .__06-Notice_divider__1U63x {
        position: relative;
        width: calc(var(--endfield-notice-u) * 4.5);
        height: 2px;
        margin-top: calc(var(--endfield-notice-u) * 1.25);
        background: var(--endfield-divider);
      }

      .resume-page.with-endfield-tab .endfield-notice-date .__06-Notice_textWrapper__nvUA3::after {
        content: "";
        position: relative;
        display: block;
        width: calc(var(--endfield-notice-u) * 3.6875);
        height: calc(var(--endfield-notice-u) * 10.875);
        margin-top: calc(var(--endfield-notice-u) * 1.5);
        margin-left: calc(var(--endfield-notice-u) * 0.25);
        background-image: url("./assets/left-deco-text.png");
        background-position: 50%;
        background-repeat: no-repeat;
        background-size: contain;
      }

      .resume-page.with-endfield-tab .endfield-corner-gameplay-deco {
        position: absolute;
        right: var(--endfield-corner-deco-inset);
        bottom: var(--endfield-corner-deco-inset);
        z-index: 3;
        width: var(--endfield-corner-deco-width);
        height: calc(var(--endfield-corner-deco-width) * 8.7368421053);
        color: var(--endfield-text);
        pointer-events: none;
      }

      .resume-page.with-endfield-tab .endfield-corner-gameplay-deco .GameplayAlbum_deco__7IAcX {
        display: block;
        position: absolute;
        left: var(--endfield-corner-deco-width);
        top: 0;
        width: calc(var(--endfield-corner-deco-width) * 8.7368421053);
        height: var(--endfield-corner-deco-width);
        transform: rotate(90deg);
        transform-origin: left top;
      }

      @media print {
        .mockup-toolbar {
          display: none;
        }

        .mockup-stage {
          padding: 0;

    </style>
  </head>
  <body>
    <nav class="mockup-toolbar" aria-label="Mockup status">
      <h1>Standard Template Mockup</h1>
      <span>普通模板外观基线，后续在这个 HTML mockup 上调整第二模板</span>
    </nav>

    <main class="mockup-stage">
      <article id="resumePage" class="resume-page density-normal" aria-label="Rendered resume"></article>
    </main>

    <script type="module">
      import { exampleMarkdown } from "../src/example.js?v=20260522";
      import { parseResumeMarkdown } from "../src/parser.js?v=20260522";
      import { renderResumeHtml } from "../src/render.js?v=20260522";
      import { markContactRowStarts } from "../src/contactRows.js?v=20260522";

      const resumePage = document.querySelector("#resumePage");
      const doc = parseResumeMarkdown(exampleMarkdown);
      const placeholderPhoto = `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 280">
  <rect width="220" height="280" fill="#f2f2f2"/>
  <rect x="18" y="18" width="184" height="244" fill="none" stroke="#d9d9d9" stroke-width="4"/>
  <circle cx="110" cy="96" r="36" fill="#a6a6a6"/>
  <path d="M48 224c7-45 31-70 62-70s55 25 62 70" fill="#a6a6a6"/>
  <text x="110" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#999">PHOTO</text>
</svg>`)}`;

      doc.uploadedPhoto = placeholderPhoto;
      resumePage.innerHTML = renderResumeHtml(doc);
      resumePage.classList.add("with-endfield-tab");
      resumePage.style.setProperty("--accent-color", "#fffa00");
      addEndfieldOperatorBackground(resumePage);
      addEndfieldNoticeDate(resumePage);
      addEndfieldCornerGameplayDeco(resumePage);
      markContactRowStarts(resumePage);
      transformProfileHeading(resumePage);
      transformProfileContacts(resumePage);
      transformSectionHeadings(resumePage);

      function transformProfileHeading(root) {
        const profile = root.querySelector(".resume-profile");
        const heading = profile?.querySelector("h1");

        if (!profile || !heading) {
          return;
        }

        const container = document.createElement("div");
        const inner = document.createElement("div");
        const icons = document.createElement("div");
        const nameContainer = document.createElement("div");
        const leftBracket = document.createElement("span");
        const rightBracket = document.createElement("span");
        const assaultIcon = document.createElement("div");
        const electricIcon = document.createElement("div");

        container.className = "endfield-profile-heading __02-Operator_titleContainer__6rOf9";
        inner.className = "__02-Operator_titleInnerContainer__1rOJW";
        icons.className = "__02-Operator_icons__Ntn1x";
        nameContainer.className = "__02-Operator_nameContainer__yjlQE";
        leftBracket.className = "__02-Operator_leftBracket__MSSfG";
        rightBracket.className = "__02-Operator_rightBracket__YpY2O";
        heading.className = "__02-Operator_title__Qc2kT";
        assaultIcon.className = "__02-Operator_icon__GnwPC";
        electricIcon.className = "__02-Operator_icon__GnwPC";
        assaultIcon.dataset.key = "assault";
        electricIcon.dataset.key = "electric";
        leftBracket.textContent = "[";
        rightBracket.textContent = "]";

        icons.append(assaultIcon, electricIcon);
        nameContainer.append(leftBracket, heading, rightBracket);
        inner.append(icons, nameContainer);
        container.append(inner);
        profile.prepend(container);
      }

      function addEndfieldOperatorBackground(root) {
        const background = document.createElement("div");

        background.className = "endfield-operator-bg";
        background.setAttribute("aria-hidden", "true");
        background.innerHTML = `
          <div class="endfield-operator-bg-stage">
            <div class="endfield-bg-deco">
              <div class="endfield-bg-shallow"></div>
              <div class="endfield-bg-flag"></div>
              <div class="endfield-bg-hollow">ENDFIELD</div>
              <div class="endfield-bg-tape">
                <div class="endfield-bg-color-line"></div>
              </div>
              <div class="endfield-bg-deco-line"></div>
              <div class="endfield-bg-plus"></div>
            </div>
          </div>
        `;
        root.prepend(background);
      }

      function addEndfieldNoticeDate(root) {
        const noticeDate = document.createElement("div");

        noticeDate.className = "endfield-notice-date";
        noticeDate.setAttribute("aria-hidden", "true");
        noticeDate.innerHTML = `
          <div class="__06-Notice_wrapper__g1OkM"></div>
          <div class="__06-Notice_textWrapper__nvUA3">
            <div class="__06-Notice_latest__ySg6h">0523</div>
            <div class="__06-Notice_divider__1U63x"></div>
          </div>
        `;
        root.prepend(noticeDate);
      }

      async function addEndfieldCornerGameplayDeco(root) {
        const cornerDeco = document.createElement("div");

        cornerDeco.className = "endfield-corner-gameplay-deco";
        cornerDeco.setAttribute("aria-hidden", "true");
        root.prepend(cornerDeco);

        try {
          const response = await fetch("./endfield-web.html");
          const html = await response.text();
          const officialDoc = new DOMParser().parseFromString(html, "text/html");
          const officialDeco = officialDoc.querySelector(".GameplayAlbum_deco__7IAcX");

          if (officialDeco) {
            cornerDeco.append(officialDeco.cloneNode(true));
          }
        } catch {
          cornerDeco.remove();
        }
      }

      function splitContact(contact) {
        const text = contact.textContent ?? "";
        const separatorIndex = text.indexOf("：");

        if (separatorIndex === -1) {
          return {
            label: "",
            value: text.trim(),
            valueNode: document.createTextNode(text.trim()),
          };
        }

        const label = text.slice(0, separatorIndex).trim();
        const value = text.slice(separatorIndex + 1).trim();
        const link = contact.querySelector("a");

        if (link) {
          return {
            label,
            value,
            valueNode: link.cloneNode(true),
          };
        }

        return {
          label,
          value,
          valueNode: document.createTextNode(value),
        };
      }

      function createProfileTag(contact) {
        const { label, valueNode } = splitContact(contact);
        const tag = document.createElement("div");
        const labelEl = document.createElement("div");
        const valueEl = document.createElement("div");

        tag.className = "__02-Operator_tag__FQrt0";
        labelEl.className = "__02-Operator_label__3koYX";
        valueEl.className = "__02-Operator_value__w_bbs";
        labelEl.textContent = label;
        valueEl.append(valueNode);
        tag.append(labelEl, valueEl);
        tag.dataset.profileWeight = String(estimateProfileTagWeight(label, valueEl.textContent ?? ""));
        return tag;
      }

      function getTextWeight(text) {
        return Array.from(String(text ?? "")).reduce((weight, char) => {
          return weight + (/[\u3400-\u9fff]/u.test(char) ? 2 : 1);
        }, 0);
      }

      function estimateProfileTagWeight(label, value) {
        return getTextWeight(label) + getTextWeight(value) + 8;
      }

      function createProfileTagRow(tags, index) {
        const row = document.createElement("div");

        row.className = "__02-Operator_tagContainer__dKENE";

        if (index % 2 === 1) {
          row.classList.add("is-yellow");
        }

        row.append(...tags);
        return row;
      }

      function groupProfileTags(tags) {
        const rows = [];
        let currentRow = [];
        let currentWeight = 0;
        const maxRowWeight = 96;

        for (const tag of tags) {
          const weight = Number(tag.dataset.profileWeight) || 0;
          const shouldWrap = currentRow.length > 0 && currentWeight + weight > maxRowWeight;

          if (shouldWrap) {
            rows.push(currentRow);
            currentRow = [];
            currentWeight = 0;
          }

          currentRow.push(tag);
          currentWeight += weight;
        }

        if (currentRow.length > 0) {
          rows.push(currentRow);
        }

        return rows;
      }

      function transformProfileContacts(root) {
        const contacts = root.querySelector(".resume-contacts");

        if (!contacts) {
          return;
        }

        const tagList = document.createElement("div");
        const tags = Array.from(contacts.querySelectorAll(".contact"), createProfileTag);

        tagList.className = "endfield-profile-tags";

        groupProfileTags(tags).forEach((rowTags, index) => {
          tagList.append(createProfileTagRow(rowTags, index));
        });

        contacts.replaceWith(tagList);
      }

      function transformSectionHeadings(root) {
        for (const heading of root.querySelectorAll(".resume-section > h2")) {
          const title = heading.textContent.trim();
          const pre = document.createElement("span");
          const titleRow = document.createElement("span");
          const icon = document.createElement("span");
          const titleText = document.createElement("span");

          pre.className = "__05-Gameplay_endfieldPre__LUcJv";
          titleRow.className = "endfield-section-title-row";
          icon.className = "endfield-section-title-icon";
          titleText.className = "endfield-section-title-text";
          icon.setAttribute("aria-hidden", "true");
          icon.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 23 23" class="SectionTitle_arrow__qXHl7">
              <path fill-rule="evenodd" fill="currentColor" d="M2.673,22.418 L2.673,19.398 L17.146,19.398 L0.740,2.992 L2.875,0.857 L19.280,17.263 L19.280,2.791 L22.300,2.791 L22.300,22.418 L2.673,22.418 Z"></path>
            </svg>
          `;
          titleText.textContent = title;

          titleRow.append(icon, titleText);
          heading.replaceChildren(pre, titleRow);
        }
      }

      function applySectionTitleIcon(reference) {
        const sectionIcon = reference.querySelector(".SectionTitle_icon__YpILA");

        if (!sectionIcon) {
          throw new Error("Section title icon not found");
        }

        for (const pre of resumePage.querySelectorAll(".__05-Gameplay_endfieldPre__LUcJv")) {
          pre.replaceChildren(sectionIcon.cloneNode(true));
        }
      }

      function applyOperatorBackgroundSvg(reference) {
        const lineIcon = reference.querySelector(".__02-Operator_backgroundDeco___Hj3d .__02-Operator_decoLineIcon__C5C_n");
        const plusIcon = reference.querySelector(".__02-Operator_backgroundDeco___Hj3d .__02-Operator_decoPlus__QPwgU");
        const lineTarget = resumePage.querySelector(".endfield-bg-deco-line");
        const plusTarget = resumePage.querySelector(".endfield-bg-plus");

        if (lineIcon && lineTarget) {
          lineTarget.append(lineIcon.cloneNode(true));
        }

        if (plusIcon && plusTarget) {
          plusTarget.append(plusIcon.cloneNode(true));
        }
      }

      async function loadEndfieldTab() {
        const response = await fetch("./endfield-tab.html");

        if (!response.ok) {
          throw new Error("Failed to load endfield-tab.html");
        }

        const html = await response.text();
        const reference = new DOMParser().parseFromString(html, "text/html");
        const sidebar = reference.querySelector(".endfield-sidebar");

        if (!sidebar) {
          throw new Error("Endfield sidebar not found");
        }

        resumePage.prepend(sidebar.cloneNode(true));
      }

      async function loadEndfieldHeaderDeco() {
        const response = await fetch("./endfield-web.html");

        if (!response.ok) {
          throw new Error("Failed to load endfield-web.html");
        }

        const html = await response.text();
        const reference = new DOMParser().parseFromString(html, "text/html");
        const headerDeco = reference.querySelector(".__02-Operator_pcContainer___7vsU .__02-Operator_headerDeco__LZ5YX");

        applySectionTitleIcon(reference);
        applyOperatorBackgroundSvg(reference);

        if (!headerDeco) {
          throw new Error("Operator header deco not found");
        }

        const clone = headerDeco.cloneNode(true);
        const candidateMeta = clone.querySelectorAll(".__02-Operator_nameContainer__yjlQE span");

        if (candidateMeta[0]) {
          candidateMeta[0].textContent = "CANDIDATE-01";
        }

        if (candidateMeta[1]) {
          candidateMeta[1].textContent = "01 / --";
        }

        for (const stars of clone.querySelectorAll(".__02-Operator_stars__ebGpw")) {
          stars.remove();
        }

        for (const node of clone.querySelectorAll("[style]")) {
          node.removeAttribute("style");
        }

        clone.removeAttribute("style");

        const slot = document.createElement("div");
        slot.className = "endfield-header-deco-slot";
        slot.append(clone);
        resumePage.prepend(slot);
      }

      void loadEndfieldTab();
      void loadEndfieldHeaderDeco();
    </script>
  </body>
</html>
